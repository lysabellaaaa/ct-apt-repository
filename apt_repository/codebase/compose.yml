services:
  default:
    build:
      context: .
    volumes:
      - repository:/var/lib/package-repository
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/Packages.gz"]
      interval: 2s
      timeout: 2s
      retries: 30
    stop_grace_period: 2s
  client:
    build:
      context: .
    command: ["/bin/bash", "-c", "printf '%s\n' 'deb [trusted=yes] http://default:8080 ./' > /etc/apt/sources.list; rm -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; exec tail -f /dev/null"]
    depends_on:
      default:
        condition: service_healthy
    stop_grace_period: 2s
volumes:
  repository:
