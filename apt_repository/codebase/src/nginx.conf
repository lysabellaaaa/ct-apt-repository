user www-data;
worker_processes 1;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
events { worker_connections 128; }
http {
    access_log /var/log/nginx/access.log;
    server {
        listen 8080;
        root /var/lib/package-repository/public;
        location / { try_files $uri =404; }
    }
}
